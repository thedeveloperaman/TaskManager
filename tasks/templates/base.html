<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body 
    {% if request.resolver_match.url_name in "login register" %} 
        class="auth-page" 
    {% endif %} 
    {% if request.resolver_match.url_name in "edit_task delete_task create_task" %}
        class="action-page"
    {% endif %}
    >
    <nav class="navbar">
        <div class="navbar-left">
            <a href="{% url 'tasks:home' %}">Home</a>
            <a href="{% url 'tasks:about' %}">About</a>
            <a href="{% url 'tasks:contact' %}">Contact</a>
        </div>
        <div class="navbar-right">
            {% if user.is_authenticated %}
            <a href="{% url 'tasks:logout' %}">Logout</a>
            {% else %}
            <a href="{% url 'tasks:login' %}" class="navbar-btn">Login/Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        <p>&copy; 2025 Task Manager</p>
    </footer>
</body>

</html>
