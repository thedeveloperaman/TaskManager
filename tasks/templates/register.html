{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Register</h2>
<form method="post" class="auth-form">
    {% csrf_token %}
    <p>
        {{ form.username.errors }}
        <label for="id_username">Username</label>
        <input type="text" name="username" maxlength="150" id="id_username" placeholder="Enter your username" required>
    </p>
    <p>
        {{ form.password1.errors }}
        <label for="id_password1">Password</label>
        <input type="password" name="password1" id="id_password1" placeholder="Enter your password" required>
    </p>
    <p>
        {{ form.password2.errors }}
        <label for="id_password2">Confirm Password</label>
        <input type="password" name="password2" id="id_password2" placeholder="Re-enter your password" required>
    </p>
    <button type="submit" class="btn auth-btn">Register</button>
</form>
<div class="auth-alt">
    <span>Already have an account?</span>
    <a href="{% url 'tasks:login' %}" class="btn auth-btn-alt">Login</a>
</div>
{% endblock %}
