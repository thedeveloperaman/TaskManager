{% extends 'base.html' %}
{% block title %}Delete Task{% endblock %}
{% block content %}
<div class="page-container" style="display: flex; flex-direction: column; align-items: center;">
    <h2 class="page-title" style="text-align: center; width: 100%;">Delete Task</h2>
    <form method="post" class="auth-form" style="width: 100%; max-width: 400px; text-align: center;">
        {% csrf_token %}
        <div style="width:100%;justify-content:center;text-align:center;margin-bottom:24px;">
            <span style="font-size:1.1em;">Are you sure?</span><br>
            <span style="display:inline-block;margin-top:8px;;font-size:1.05em;font-style:italic;">
                "{{ task.title }}"
            </span>
        </div>
        <div class="page-actions" style="justify-content: center;">
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'tasks:home' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
